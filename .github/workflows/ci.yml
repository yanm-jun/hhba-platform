name: HHBA Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: node --test scripts/homepage-job-card-noise.contract.test.mjs
        working-directory: apps/web

  extension-tests:
    name: Extension unit and page contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check apps/browser-extension/content.js
          node --check apps/browser-extension/popup.js
          node --check apps/browser-extension/core.mjs
          node --test apps/browser-extension/tests/core.test.mjs
          node --test apps/web/scripts/apply-assistant.contract.test.mjs

  extension-package:
    name: Extension package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify installable package
        run: |
          cd apps/browser-extension
          zip -q /tmp/HHBA-Chrome-Edge-Extension-V0.2.zip manifest.json core.mjs content.js popup.html popup.css popup.js
          unzip -t /tmp/HHBA-Chrome-Edge-Extension-V0.2.zip
          python - <<'PY'
          import json, zipfile
          package = '/tmp/HHBA-Chrome-Edge-Extension-V0.2.zip'
          with zipfile.ZipFile(package) as archive:
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['version'] == '0.2.0'
              assert archive.testzip() is None
          print('HHBA_V0_2_PACKAGE_INTEGRITY_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HHBA-Chrome-Edge-Extension-V0.2
          path: /tmp/HHBA-Chrome-Edge-Extension-V0.2.zip
          if-no-files-found: error
          retention-days: 14

  apply-assistant-backend-safety:
    name: Apply assistant backend safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check 'httpx>=0.27,<1'
      - run: python -m unittest apps.api.tests.test_apply_intelligence -v

  synthetic-form-browser:
    name: Synthetic Chinese recruitment form browser test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet --disable-pip-version-check 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
          python -u apps/browser-extension/tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-domestic-apply-browser-evidence
          path: /tmp/hhba-domestic-apply-browser.png
          if-no-files-found: ignore
          retention-days: 14
